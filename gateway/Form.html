<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --gold: #C9972C; --gold-dark: #A87A1B; --ink: #000000; --bg: #FBF7EE; --muted: #6b6b6b; }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: var(--bg); color: #222; min-height: 100vh; }
    .topbar { background: var(--ink); border-bottom: 4px solid var(--gold); padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
    .topbar img { width: 40px; height: 40px; border-radius: 8px; }
    .topbar h1 { margin: 0; font-size: 18px; color: #fff; letter-spacing: .5px; }
    .topbar p { margin: 2px 0 0; font-size: 11px; color: var(--gold); letter-spacing: 1px; }
    .topbar .right { margin-left: auto; display: none; align-items: center; gap: 10px; color: #fff; font-size: 13px; }
    .topbar .right.show { display: flex; }
    .btn-out { background: transparent; border: 1px solid var(--gold); color: var(--gold); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.08); padding: 28px; }
    .login { max-width: 380px; margin: 24px auto; }
    .login h2 { margin: 0 0 4px; font-size: 20px; }
    .login .sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    label { display: block; font-size: 13px; font-weight: bold; margin: 12px 0 6px; }
    input { width: 100%; padding: 11px 12px; border: 1px solid #d6d0c2; border-radius: 8px; font-size: 15px; }
    input:focus { outline: none; border-color: var(--gold); }
    .btn { width: 100%; margin-top: 20px; padding: 12px; background: var(--gold); color: var(--ink); border: 0; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn:hover { background: var(--gold-dark); }
    .btn:disabled { opacity: .6; cursor: wait; }
    .note { min-height: 18px; margin-top: 12px; font-size: 13px; color: #b42318; }
    .hello { margin: 0 0 4px; font-size: 20px; }
    .grid { display: grid; gap: 14px; margin-top: 20px; }
    a.portal { display: block; text-decoration: none; color: inherit; border: 2px solid #e8e0cc; border-radius: 12px; padding: 18px 20px; background: #fff; transition: border-color .15s, transform .15s; }
    a.portal:hover { border-color: var(--gold); transform: translateY(-1px); }
    a.portal.main { border-color: var(--gold); background: #fffaf0; }
    a.portal .t { font-size: 17px; font-weight: bold; }
    a.portal .d { font-size: 13px; color: var(--muted); margin-top: 4px; }
    a.portal .go { float: right; color: var(--gold-dark); font-weight: bold; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 18px; }
    .copy { margin-top: 10px; text-align: center; font-size: 11px; color: #b3ad9f; }
    .hidden { display: none; }
    @media (max-width: 560px) {
      .topbar { padding: 10px 12px; gap: 10px; }
      .topbar img { width: 34px; height: 34px; }
      .topbar h1 { font-size: 14px; letter-spacing: .3px; }
      .topbar p { font-size: 9px; letter-spacing: .5px; }
      #topUser { display: none; }
    }
  </style>
<!-- ===================== BMI POLISH v4 (gaya mockup Canva v4: classy, simple, modern) =====================
  Hanya tampilan: huruf, warna, garis, sudut, tombol, tabel. Tata letak & logika tidak berubah.
  Hapus seluruh blok ini (sampai 'akhir BMI POLISH') untuk kembali ke tampilan lama. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" media="print" onload="this.media='all'">
<style>
  :root { --bmi-font: 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif !important;  /* !important: paket animasi di bawah juga mengisi variabel ini */ }
  body { font-family: var(--bmi-font); font-optical-sizing: auto; letter-spacing: -.003em; color: #191917; -webkit-font-smoothing: antialiased; }
  button, input { font-family: inherit; }
  .topbar { border-bottom-width: 3px; }
  .topbar h1 { font-weight: 650; letter-spacing: .02em; }
  .card { box-shadow: none; border: 1px solid #ECE4D3; border-radius: 20px; }
  .login h2, .hello { font-size: 24px; font-weight: 650; letter-spacing: -.03em; }
  .login .sub, #menuSub { color: #7A776E; }
  label { font-weight: 600; color: #4a4842; }
  input { background: #FBF9F4; border: 1px solid #E6DECD; border-radius: 12px; }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,151,44,.18); background: #fff; }
  .btn { border-radius: 999px; color: #111; font-weight: 650; letter-spacing: .005em; }
  .btn-out { border-radius: 999px; padding: 7px 14px; }
  a.portal { border: 1px solid #ECE4D3; border-radius: 18px; padding: 20px 22px; }
  a.portal:hover { border-color: #DCCBA3; }
  a.portal .t { font-weight: 650; letter-spacing: -.015em; }
  a.portal.main { background: #000; border-color: #000; color: #fff; }
  a.portal.main .d { color: #a9a395; }
  a.portal.main .go, a.portal .go { color: var(--gold); }
  a.portal:not(.main) .go { color: var(--gold-dark); }
</style>
<!-- ===================== akhir BMI POLISH ===================== -->
</head>
<body>
<!-- =====================================================================
  BMI FEEDBACK KIT — animasi loading & umpan balik untuk Portal FTTH, Portal Waspang, Gateway
  Tempel SELURUH isi file ini tepat setelah tag <body> di Form.html.
  (Ketiga portal memakai createHtmlOutputFromFile, jadi cara include() TIDAK berlaku tanpa mengubah doGet.)
  Tidak butuh library. Aman untuk HP. Menghormati "kurangi animasi" (prefers-reduced-motion).
  Panggil lewat objek global BMI — lihat PANDUAN_ANIMASI.md.
====================================================================== -->
<style>
  :root{--bmi-gold:#C9972C;--bmi-gold-d:#A87A1B;--bmi-ink:#191917;--bmi-mut:#7A776E;--bmi-line:#ECE4D3;
    --bmi-skel:#EFE8DA;--bmi-skel-hi:#F9F6EF;--bmi-ok:#2F7D4F;--bmi-err:#A2442F;--bmi-font:'Plus Jakarta Sans',Arial,sans-serif}
  @keyframes bmiSpin{to{transform:rotate(360deg)}}
  @keyframes bmiShimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
  @keyframes bmiSlide{from{left:-40%}to{left:100%}}
  @keyframes bmiDraw{to{stroke-dashoffset:0}}
  @keyframes bmiPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
  @keyframes bmiEnter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes bmiToastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes bmiToastOut{to{opacity:0;transform:translateY(8px)}}
  @keyframes bmiWave{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:0;transform:scale(1.25)}}

  /* 1. Splash saat portal pertama dibuka */
  #bmiSplash{position:fixed;inset:0;z-index:100002;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease,visibility .45s}
  #bmiSplash.bmi-hide{opacity:0;visibility:hidden}
  .bmi-sp{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:0 24px}
  .bmi-sp-logo{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
  .bmi-sp-logo img{width:60px;height:60px;border-radius:16px;position:relative;z-index:1}
  .bmi-sp-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(201,151,44,.16);border-top-color:var(--bmi-gold);animation:bmiSpin 1.1s linear infinite}
  .bmi-sp-wave{position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(201,151,44,.35);animation:bmiWave 2.2s ease-out infinite}
  .bmi-sp-wave.w2{animation-delay:1.1s}
  .bmi-sp-t{font:700 15px/1.25 var(--bmi-font);color:#fff;letter-spacing:.12em}
  .bmi-sp-s{font:600 10.5px var(--bmi-font);letter-spacing:.24em;color:var(--bmi-gold);margin-top:-8px}
  .bmi-sp-msg{font:500 12.5px var(--bmi-font);color:#8f8b80;min-height:16px}

  /* 2. Garis emas berjalan di atas layar (pindah halaman / ambil data) */
  #bmiTop{position:fixed;top:0;left:0;height:3px;width:0;z-index:100003;background:var(--bmi-gold);box-shadow:0 0 10px rgba(201,151,44,.55);opacity:0;transition:width .35s ease,opacity .35s ease;pointer-events:none}
  #bmiTop.on{opacity:1}

  /* 3. Spinner & tombol sibuk / berhasil */
  .bmi-spin{display:inline-block;width:16px;height:16px;flex:none;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:bmiSpin .7s linear infinite;vertical-align:-3px}
  .bmi-busy{pointer-events:none;cursor:progress;opacity:.92}
  .bmi-busy .bmi-spin,.bmi-ok-ic{margin-right:8px}
  .bmi-ok-ic{display:inline-block;vertical-align:-3px}
  .bmi-ok-ic path{stroke-dasharray:24;stroke-dashoffset:24;animation:bmiDraw .4s .05s ease forwards}
  .bmi-btn-ok{background:var(--bmi-ok)!important;border-color:var(--bmi-ok)!important;color:#fff!important}

  /* 4. Skeleton (pengganti tulisan "Memuat...") */
  .bmi-skel{display:block;height:12px;border-radius:7px;background:linear-gradient(90deg,var(--bmi-skel) 25%,var(--bmi-skel-hi) 37%,var(--bmi-skel) 63%);background-size:400% 100%;animation:bmiShimmer 1.4s ease infinite}
  tr.bmi-skel-row td{padding:13px 10px!important;border-color:#F3EEE3!important;background:transparent!important}
  .bmi-skel-card{border:1px solid var(--bmi-line);border-radius:16px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:10px}
  .bmi-skel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

  /* 5. Panel proses lama (baca BOQ / OCR / kirim WhatsApp) */
  #bmiProc{position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
  #bmiProc.on{opacity:1;visibility:visible}
  .bmi-pc{width:100%;max-width:420px;background:#fff;border-radius:20px;border-top:4px solid var(--bmi-gold);padding:22px 22px 18px;font-family:var(--bmi-font);color:var(--bmi-ink);box-shadow:0 24px 60px rgba(0,0,0,.3);transform:translateY(8px);transition:transform .25s}
  #bmiProc.on .bmi-pc{transform:none}
  .bmi-pc-h{display:flex;align-items:center;gap:12px}
  .bmi-pc-ic{width:42px;height:42px;border-radius:13px;background:#F6F1E6;color:var(--bmi-gold-d);display:flex;align-items:center;justify-content:center;flex:none}
  .bmi-pc-ic .bmi-spin{width:20px;height:20px}
  .bmi-pc-t{font-weight:700;font-size:16px;line-height:1.3}
  .bmi-pc-m{color:var(--bmi-mut);font-size:13px;margin-top:2px;line-height:1.45}
  .bmi-pc-bar{position:relative;height:6px;border-radius:99px;background:#F1ECE1;overflow:hidden;margin:16px 0 6px}
  .bmi-pc-bar i{position:absolute;top:0;bottom:0;width:40%;border-radius:99px;background:var(--bmi-gold);animation:bmiSlide 1.2s ease-in-out infinite}
  .bmi-pc-bar.det i{position:static;display:block;height:100%;animation:none;transition:width .3s}
  .bmi-pc-time{display:flex;justify-content:space-between;font-size:11.5px;color:#9a968c;font-variant-numeric:tabular-nums}
  .bmi-steps{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
  .bmi-steps li{display:flex;gap:10px;align-items:center;font-size:13.5px;color:#a9a59a}
  .bmi-steps li i{width:20px;height:20px;border-radius:50%;border:1.5px solid #DCD4C3;display:flex;align-items:center;justify-content:center;flex:none;font-style:normal;font-size:11px}
  .bmi-steps li.doing{color:var(--bmi-ink);font-weight:600}
  .bmi-steps li.doing i{border-color:var(--bmi-gold);border-right-color:transparent;animation:bmiSpin .8s linear infinite}
  .bmi-steps li.done{color:var(--bmi-ink)}
  .bmi-steps li.done i{background:var(--bmi-ink);border-color:var(--bmi-ink);color:var(--bmi-gold)}
  .bmi-steps li.fail{color:var(--bmi-err);font-weight:600}
  .bmi-steps li.fail i{border-color:var(--bmi-err);background:var(--bmi-err);color:#fff;animation:none}
  .bmi-pc.ok .bmi-pc-ic{background:#E9F3EC;color:var(--bmi-ok);animation:bmiPop .4s ease}
  .bmi-pc.err .bmi-pc-ic{background:#FBEAE6;color:var(--bmi-err)}
  .bmi-pc.ok .bmi-pc-bar i{width:100%!important;animation:none;left:0;background:var(--bmi-ok)}
  .bmi-pc.err .bmi-pc-bar i{width:100%!important;animation:none;left:0;background:var(--bmi-err)}
  .bmi-pc-act{display:flex;justify-content:flex-end;margin-top:14px}
  .bmi-pc-act[hidden]{display:none}
  .bmi-pc-act button{font:700 13.5px var(--bmi-font);border:0;border-radius:999px;padding:10px 18px;background:var(--bmi-ink);color:#fff;cursor:pointer}

  /* 6. Progress berangka (memuat foto 3 dari 6, upload) */
  .bmi-prog-l{display:flex;justify-content:space-between;font:500 12.5px var(--bmi-font);color:var(--bmi-mut);margin-bottom:6px;font-variant-numeric:tabular-nums}
  .bmi-prog-l b{color:var(--bmi-ink)}
  .bmi-prog{height:8px;border-radius:99px;background:#F1ECE1;overflow:hidden}
  .bmi-prog i{display:block;height:100%;width:0;border-radius:99px;background:var(--bmi-gold);transition:width .35s ease}
  .bmi-prog.full i{background:var(--bmi-ok)}

  /* 7. Toast (notifikasi singkat) */
  #bmiToasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100001;display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 24px);pointer-events:none}
  .bmi-toast{display:flex;align-items:center;gap:10px;background:#111;color:#fff;border-radius:14px;padding:12px 16px;font:600 13.5px/1.4 var(--bmi-font);box-shadow:0 14px 30px rgba(0,0,0,.25);border-left:3px solid var(--bmi-gold);animation:bmiToastIn .28s ease both;pointer-events:auto}
  .bmi-toast.ok{border-left-color:#5FB37D}.bmi-toast.err{border-left-color:#E0735B}
  .bmi-toast .bmi-ti{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:rgba(255,255,255,.1)}
  .bmi-toast.out{animation:bmiToastOut .25s ease forwards}
  @media (max-width:680px){#bmiToasts{bottom:96px}}

  /* 8. Keadaan kosong & gagal */
  .bmi-state{text-align:center;padding:26px 16px;color:var(--bmi-mut);font:400 13.5px/1.5 var(--bmi-font);animation:bmiEnter .3s ease both}
  .bmi-state .bmi-st-ic{width:46px;height:46px;border-radius:15px;background:#F6F1E6;color:var(--bmi-gold-d);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
  .bmi-state.err .bmi-st-ic{background:#FBEAE6;color:var(--bmi-err)}
  .bmi-state b{display:block;color:var(--bmi-ink);font-size:14.5px;margin-bottom:2px}
  .bmi-state button{margin-top:12px;font:700 13px var(--bmi-font);border:1px solid #DCCBA3;background:#fff;color:var(--bmi-gold-d);border-radius:999px;padding:9px 16px;cursor:pointer}

  /* 9b. Otomatis: spinner kecil di tombol/teks yang sedang memuat, bar tunggu di kotak status */
  .bmi-spin.bmi-auto{width:1em;height:1em;border-width:.14em;margin-right:.45em;vertical-align:-.15em;opacity:.9}
  button .bmi-spin.bmi-auto{margin-right:.5em}
  .bmi-wait{display:flex;align-items:center;gap:10px;margin-top:9px}
  .bmi-wait .bmi-pc-bar{flex:1;margin:0;height:4px;background:rgba(0,0,0,.07)}
  .bmi-wait-t{font:600 11px var(--bmi-font);color:#8a867c;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
  .bmi-skel.bmi-inl{display:inline-block;vertical-align:middle;width:3.2em;height:.72em;border-radius:6px}
  td.bmi-st-td{border:0!important;background:transparent!important}
  .bmi-toast .bmi-ti .bmi-spin{width:11px;height:11px;border-width:2px;vertical-align:0}

  /* 9. Transisi masuk halaman/kartu */
  .bmi-enter{animation:bmiEnter .32s ease both}

  @media (prefers-reduced-motion:reduce){
    #bmiSplash *,#bmiTop,.bmi-spin,.bmi-wait *,.bmi-skel,.bmi-pc *,.bmi-toast,.bmi-state,.bmi-enter,.bmi-steps li i{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    .bmi-pc-bar i{left:0!important;width:100%!important;opacity:.5}
  }
</style>

<div id="bmiSplash" role="status" aria-live="polite">
  <div class="bmi-sp">
    <div class="bmi-sp-logo"><span class="bmi-sp-wave"></span><span class="bmi-sp-wave w2"></span><span class="bmi-sp-ring"></span>
      <img src="https://buanamenara.github.io/portal-ftth/icon-192.png" alt="BMI" onerror="this.style.display='none'"></div>
    <div class="bmi-sp-t" id="bmiSplashT">FTTH PROJECT CONTROL PORTAL</div>
    <div class="bmi-sp-s">PT BUANA MENARA INDONESIA</div>
    <div class="bmi-sp-msg" id="bmiSplashMsg">Menyiapkan portal...</div>
  </div>
</div>
<div id="bmiTop"></div>

<script>
(function () {
  if (window.BMI) return;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var CHECK = '<svg class="bmi-ok-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ICON = {
    ok: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    err: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 7v6M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>',
    empty: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2.5-7h13L21 13v6H3z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></svg>'
  };
  var BMI = {};

  /* ---------- 1. Splash ---------- */
  // Judul splash per portal: isi window.BMI_TITLE (mis. 'PORTAL WASPANG') di tag script tersendiri SEBELUM paket ini.
  if (window.BMI_TITLE && $('bmiSplashT')) $('bmiSplashT').textContent = window.BMI_TITLE;
  var splashStart = Date.now(), splashHold = false;
  BMI.splash = {
    msg: function (t) { var m = $('bmiSplashMsg'); if (m) m.textContent = t; },
    show: function (t) { var s = $('bmiSplash'); if (!s) return; if (t) this.msg(t); s.classList.remove('bmi-hide'); splashStart = Date.now(); },
    hide: function () { var s = $('bmiSplash'); if (!s) return; var wait = Math.max(0, 400 - (Date.now() - splashStart)); setTimeout(function () { s.classList.add('bmi-hide'); }, wait); },
    hold: function () { splashHold = true; }   // panggil sebelum load bila splash ingin ditutup manual (BMI.splash.hide())
  };
  window.addEventListener('load', function () { if (!splashHold) BMI.splash.hide(); });
  // Pengaman: splash TIDAK PERNAH menutupi portal lebih dari 8 detik, walau hide() tidak terpanggil (mis. ada error).
  setTimeout(function () { var s = $('bmiSplash'); if (s) s.classList.add('bmi-hide'); }, 8000);
  // Matikan splash: isi window.BMI_NO_SPLASH = true di tag script tersendiri SEBELUM paket ini.
  if (window.BMI_NO_SPLASH) { var s0 = $('bmiSplash'); if (s0) s0.classList.add('bmi-hide'); }

  /* ---------- 2. Garis emas atas ---------- */
  var topTimer = null, topVal = 0, topCount = 0, topGuard = null;
  BMI.top = {
    start: function () {
      var b = $('bmiTop'); if (!b) return; topCount++;
      if (topCount > 1) return;
      topVal = 8; b.style.transition = 'none'; b.style.width = '0'; b.offsetWidth; b.style.transition = '';
      b.classList.add('on'); b.style.width = topVal + '%';
      clearInterval(topTimer);
      topTimer = setInterval(function () { topVal += (90 - topVal) * 0.08; b.style.width = topVal + '%'; }, 250);
      // Pengaman: garis tidak pernah menggantung lebih dari 2 menit walau ada panggilan yang tidak pernah kembali.
      clearTimeout(topGuard); topGuard = setTimeout(function () { topCount = 1; BMI.top.done(); }, 120000);
    },
    done: function () {
      var b = $('bmiTop'); if (!b) return; topCount = Math.max(0, topCount - 1);

    if (n.classList.contains('status')) checkStatus(n);
    checkLeaf(n);
  }
  function deep(n) {
    if (n.nodeType !== 1 || skip(n)) return;
    if (n.tagName === 'TBODY') checkTbody(n);
    if (n.tagName === 'BUTTON') checkBtn(n);
    if ((n.textContent || '').indexOf('⏳') < 0) return;
    var w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT, null, false), list = [], c;
    while ((c = w.nextNode())) if (HOURGLASS.test(c.nodeValue) && c.parentNode) list.push(c.parentNode);
    list.forEach(function (p) { var b = p.closest('button'); if (b) checkBtn(b); else if (!skip(p)) hourglass(p); });
  }
  BMI.auto = {
    scan: function (root) {
      root = root || document.body; if (!root) return;
      Array.prototype.forEach.call(root.querySelectorAll('tbody'), function (tb) { if (!skip(tb)) checkTbody(tb); });
      Array.prototype.forEach.call(root.querySelectorAll('button'), function (b) { if (!skip(b)) checkBtn(b); });
      Array.prototype.forEach.call(root.querySelectorAll('.status'), function (n) { if (!skip(n)) checkStatus(n); });
      Array.prototype.forEach.call(root.querySelectorAll('div,span,p,small,td,li,label,b,strong,em'), function (n) { if (n.childElementCount === 0 && !skip(n)) checkLeaf(n); });
    }
  };
  function startAuto() {
    try {
      BMI.auto.scan();
      new MutationObserver(function (recs) {
        try {
          for (var i = 0; i < recs.length; i++) {
            var r = recs[i];
            if (r.type === 'attributes') {
              var t = r.target;
              if (pw && t === pw.el) { procFollow(t); continue; }
              if (r.attributeName === 'style') continue;
              if (t.tagName === 'BUTTON') { if (!skip(t)) checkBtn(t); }
              else if (r.attributeName === 'class' && t.classList && t.classList.contains('status') && !skip(t)) checkStatus(t);
              continue;
            }
            visit(r.target);
            for (var j = 0; j < r.addedNodes.length; j++) deep(r.addedNodes[j]);
          }
        } catch (e) { /* animasi tidak boleh mengganggu portal */ }
      }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['disabled', 'class', 'style'] });
    } catch (e) { /* abaikan */ }
  }
  if (!window.BMI_NO_AUTO) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startAuto); else startAuto();
  }

  window.BMI = BMI;
})();
</script>

<script>
(function () {
  var KEY = 'bmiGatewaySession';
  var TTL = 6 * 60 * 60 * 1000;   // sama dengan masa sesi di server (tanpa password)
  var REFRESH = 60 * 1000;        // tiket Portal FTTH diperbarui tiap menit selama menu terbuka
  var timer = null;
  var SHELL_ORIGIN = 'https://buanamenara.github.io';   // halaman aplikasi (PWA) yang membingkai Gateway
  var GO = '';   // portal yang diminta portal lain (?go=): dibuka otomatis sekali setelah menu siap
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function roleLabel(r) { return r === 'rpm' ? 'RPM' : (r === 'waspang' ? 'Waspang' : 'Admin'); }

  function saveSession(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  function clearSession() { try { localStorage.removeItem(KEY); } catch (e) {} }
  // Keluar: sesi di server diakhiri dan tercatat di LOG HISTORY, lalu sesi di HP ini dihapus.
  function logout() {
    var s = loadSession();
    if (s) { try { google.script.run.logoutUser(s.sid); } catch (e) {} }
    clearSession();
  }
  function loadSession() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s && s.sid && s.exp > Date.now()) return s;
      localStorage.removeItem(KEY);
    } catch (e) {}
    return null;
  }

  function renderLinks(list) {
    if (GO) {
      var go = list.filter(function (p) { return p.key === GO; })[0];
      GO = '';
      // Aplikasi (PWA) yang pindah halaman; tautan dibuka di dalam bingkainya seperti klik biasa.
      if (go) { try { window.top.postMessage({ bmi: 'open', href: go.href }, SHELL_ORIGIN); } catch (e) {} }
    }
    $('menuGrid').innerHTML = list.map(function (p, i) {
      return '<a class="portal' + (i === 0 ? ' main' : '') + '" href="' + esc(p.href) + '" target="_top">' +
        '<span class="go">Buka &rarr;</span><div class="t">' + esc(p.title) + '</div><div class="d">' + esc(p.desc) + '</div></a>';
    }).join('');
  }

  function refreshLinks(s) {
    google.script.run
      .withSuccessHandler(function (list) { renderLinks(list); })
      .withFailureHandler(function (err) {
        var m = (err && err.message) || '';
        if (/sesi habis/i.test(m)) { clearSession(); showLogin(m); }
      })
      .portalLinks(s.sid);
  }

  function showMenu(s) {
    $('screenLogin').classList.add('hidden');
    $('screenMenu').classList.remove('hidden');
    $('topRight').classList.add('show');
    $('topUser').textContent = s.name + ' (' + roleLabel(s.role) + ')';
    $('menuHello').textContent = 'Halo, ' + s.name;
    $('menuSub').textContent = 'Pilih portal yang ingin dibuka' + (s.area ? ' · Area ' + s.area : '') + '.';
    $('menuGrid').innerHTML = '<div class="d" style="color:var(--muted);font-size:13px">Menyiapkan menu...</div>';
    refreshLinks(s);
    menuSession = s;
    if (timer) clearInterval(timer);
    // Saat aplikasi tidak terlihat (HP dikunci/pindah aplikasi) tautan tidak diperbarui; begitu terlihat lagi langsung diperbarui.
    timer = setInterval(function () { if (!document.hidden) refreshLinks(s); }, REFRESH);
  }
  var menuSession = null;
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && timer && menuSession) refreshLinks(menuSession);
  });

  function showLogin(msg) {
    if (timer) { clearInterval(timer); timer = null; }
    $('screenMenu').classList.add('hidden');
    $('screenLogin').classList.remove('hidden');
    $('topRight').classList.remove('show');
    $('loginPassword').value = '';
    $('loginNote').textContent = msg || '';
    setTimeout(function () { try { $('loginUsername').focus(); } catch (e) {} }, 100);
  }

  function tryLogin() {
    var u = $('loginUsername').value.trim(), p = $('loginPassword').value;
    if (!u || !p) { $('loginNote').textContent = 'Isi username dan password.'; return; }
    if (window.BMI) BMI.busy($('btnLogin'), 'Memeriksa...');   // sebelum disabled, supaya reset() mengaktifkan tombol lagi
    $('btnLogin').disabled = true;
    $('loginNote').textContent = '';
    google.script.run
      .withSuccessHandler(function (res) {
        $('btnLogin').disabled = false;
        if (window.BMI) BMI.reset($('btnLogin'));
        $('loginPassword').value = '';
        res.exp = Date.now() + TTL;
        saveSession(res);
        showMenu(res);
      })
      .withFailureHandler(function (err) {
        $('btnLogin').disabled = false;
        if (window.BMI) BMI.reset($('btnLogin'));
        $('loginNote').textContent = (err && err.message) || 'Gagal masuk. Coba lagi.';
      })
      .loginUser(u, p);
  }

  $('btnLogin').addEventListener('click', tryLogin);
  $('loginPassword').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryLogin(); });
  $('loginUsername').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginPassword').focus(); });
  $('btnLogout').addEventListener('click', function () { logout(); showLogin(''); });

  // ?logout=1: Keluar dari portal lain juga mengakhiri sesi Gateway. ?go=<portal>: langsung kembali ke portal itu.
  function start(p) {
    p = p || {};
    if (p.logout === '1') logout();
    if (/^[a-z]+$/.test(p.go || '')) GO = p.go;
    var s = loadSession();
    if (s) showMenu(s); else showLogin('');
  }
  try { google.script.url.getLocation(function (loc) { start(loc && loc.parameter); }); } catch (e) { start(); }
})();
</script>
