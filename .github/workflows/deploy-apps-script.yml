# Deploy Apps Script tanpa laptop.
# Cara pakai: push commit yang mau dipasang ke branch deploy-waspang / deploy-ftth / deploy-gateway
#   git push -f origin <commit>:refs/heads/deploy-waspang
# atau jalankan manual dari tab Actions (workflow_dispatch, setelah file ini ada di main).
# Kunci login clasp (akun pemilik Apps Script) disimpan di secret repo CLASPRC_JSON.
# Setelah deploy berhasil, MEMORY.md di main ikut diperbarui (versi live + riwayat deploy), lihat AGENTS.md.
# Isi project di Apps Script diambil dulu (clasp pull), lalu HANYA kode + Form.html dari repo yang ditimpa,
# jadi file lain di project (manifest, template BOQ, KopSurat) tidak berubah.
name: Deploy Apps Script

on:
  push:
    branches: [deploy-waspang, deploy-ftth, deploy-gateway]
  workflow_dispatch:
    inputs:
      project:
        description: 'waspang / ftth / gateway'
        required: true
        default: waspang

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

permissions:
  contents: write   # untuk commit MEMORY.md ke main setelah deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Pilih project
        id: p
        run: |
          P="${{ github.event.inputs.project }}"
          [ -z "$P" ] && P="${GITHUB_REF_NAME#deploy-}"
          case "$P" in
            waspang) echo "script=1zzLE_fmwlJ5Bf2MPX7uqHeVYU3IbHt0Ea0Z3-DSf9yA0tr9sBGJAHT7b" >> $GITHUB_OUTPUT
                     echo "dep=AKfycbw4TJYefbBIIoBS4Kztyv2lClvmngtIMotFbSLfp_E6ptKjv0qVwDBg_ppR1fY8zGKG" >> $GITHUB_OUTPUT
                     echo "src=portal-waspang" >> $GITHUB_OUTPUT; echo "code=Code.js" >> $GITHUB_OUTPUT ;;
            ftth)    echo "script=1j4r7wN_Oujagy9gFg2IMQyfFOaECyUxSzLkNwsw-bZU06MMojyZO41kU" >> $GITHUB_OUTPUT
                     echo "dep=AKfycbwO25NZjRNu11QfyZQDGp1ZAPHdR-PwMwrc3U09lGUQ03KH91bNUl178-A7F246fm_djw" >> $GITHUB_OUTPUT
                     echo "src=portal-ftth-gas" >> $GITHUB_OUTPUT; echo "code=Kode.js" >> $GITHUB_OUTPUT ;;
            gateway) echo "script=1cb-gaBiILQeNXd-c8NLrP1NY-GtjxLfKR4zPVq53gR47XXs0gT73qAOh" >> $GITHUB_OUTPUT
                     echo "dep=AKfycby4nXXb8JKdAJodp6MdrNfdmNODiCdWr4ouZPKOP6w4wz1tDZLCSqe11eeU9oHYgmVxeQ" >> $GITHUB_OUTPUT
                     echo "src=gateway" >> $GITHUB_OUTPUT; echo "code=Kode.js" >> $GITHUB_OUTPUT ;;
            *) echo "Project tidak dikenal: $P"; exit 1 ;;
          esac
          echo "name=$P" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Pasang clasp + kunci login
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          [ -n "$CLASPRC" ] || { echo "Secret CLASPRC_JSON belum diisi"; exit 1; }
          npm install -g @google/clasp@3.4.1 >/dev/null
          umask 077; printf '%s' "$CLASPRC" > ~/.clasprc.json

      - name: Ambil isi project sekarang, timpa kode dari repo
        run: |
          mkdir w && cd w
          printf '{"scriptId":"%s","rootDir":""}' "${{ steps.p.outputs.script }}" > .clasp.json
          clasp pull
          echo "Sebelum:"; md5sum * | sed 's/^/  /'
          cp "../${{ steps.p.outputs.src }}/Kode.gs" "${{ steps.p.outputs.code }}"
          cp "../${{ steps.p.outputs.src }}/Form.html" Form.html
          echo "Sesudah:"; md5sum * | sed 's/^/  /'

      - name: Push + deploy
        id: d
        working-directory: w
        run: |
          DESC="$(git -C .. log -1 --format=%s | cut -c1-90)"
          clasp push -f
          OUT="$(clasp deploy -i "${{ steps.p.outputs.dep }}" -d "$DESC")"
          echo "$OUT"
          V="$(echo "$OUT" | grep -o '@[0-9]\+' | tail -1 | tr -d @)"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "desc=$DESC" >> $GITHUB_OUTPUT

      - name: Cek web app
        run: |
          sleep 5
          URL="https://script.google.com/macros/s/${{ steps.p.outputs.dep }}/exec"
          [ "${{ steps.p.outputs.name }}" = waspang ] && URL="$URL?api=json"
          CODE=$(curl -s -L -o out.txt -w '%{http_code}' "$URL")
          echo "HTTP $CODE"; head -c 300 out.txt; echo
          [ "$CODE" = 200 ] || exit 1

      - name: Perbarui MEMORY.md di main
        if: steps.d.outputs.version != ''
        env:
          P: ${{ steps.p.outputs.name }}
          V: ${{ steps.d.outputs.version }}
          SUBJ: ${{ steps.d.outputs.desc }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=20 origin main
          git worktree add -q ../mem origin/main
          cd ../mem
          # main belum punya file memori (PR belum di-merge): salin dari commit yang di-deploy
          for f in MEMORY.md AGENTS.md CLAUDE.md GEMINI.md scripts/update-memory.mjs; do
            [ -f "$f" ] || { mkdir -p "$(dirname "$f")"; cp "$GITHUB_WORKSPACE/$f" "$f"; }
          done
          node scripts/update-memory.mjs --project "$P" --version "$V" --commit "$GITHUB_SHA" --subject "$SUBJ" --by "GitHub Actions"
          git add -A
          git commit -q -m "memory: $P @$V - $SUBJ"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep 3; git fetch --depth=20 origin main; git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Hapus kunci login
        if: always()
        run: rm -f ~/.clasprc.json
