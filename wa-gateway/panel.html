<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRIS Gateway</title><link rel="icon" href="/mata.png">
<style>
:root{--bg:#0B0B0A;--card:#141310;--line:#26231c;--gold:#E3B651;--gold2:#C9972C;--txt:#EDE7D9;--mut:#8e8778;--ok:#5BD08A;--bad:#E06A5A}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:18px;height:100vh}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.side{background:#000;border-color:#3a3020;display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px;text-align:center;position:relative}
.more{position:absolute;top:10px;right:10px;width:32px;height:32px;border:0;color:var(--mut);font-size:18px}.more:hover{color:var(--gold)}
.emb{width:168px;height:168px;border-radius:50%;overflow:hidden;transition:box-shadow .4s}
.emb img{width:100%;height:100%;display:block}
.emb.on{box-shadow:0 0 0 4px var(--ok),0 0 42px rgba(63,184,116,.28)}
.emb.warn{box-shadow:0 0 0 4px var(--gold2),0 0 36px rgba(227,182,81,.22)}
.emb.off{box-shadow:0 0 0 4px var(--bad),0 0 36px rgba(224,106,90,.22)}
.emb.idle{box-shadow:0 0 0 4px #5b564b}.emb.idle img{filter:grayscale(.85) brightness(.7)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.p-ok{background:rgba(91,208,138,.12);color:var(--ok)}.p-warn{background:rgba(227,182,81,.14);color:var(--gold)}.p-bad{background:rgba(224,106,90,.14);color:var(--bad)}
.p-idle{background:#24221d;color:#b3ab98}
.p-ok i{animation:pulse 2s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,208,138,.5)}100%{box-shadow:0 0 0 9px rgba(91,208,138,0)}}
.mut{color:var(--mut)}.small{font-size:13px}
.btns{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap;justify-content:center}
.side{padding:22px 14px}.side .btns{flex-wrap:nowrap;gap:6px}.side .btns button{white-space:nowrap;padding:0 12px}.side .btns button.ic{padding:0;flex:none}
button{font:inherit;cursor:pointer;height:38px;padding:0 16px;border-radius:999px;font-weight:700;font-size:13px;border:1.5px solid #5a4a24;color:var(--gold);background:transparent}
button:hover{border-color:var(--gold)}button.pri{background:linear-gradient(#E9C46A,#C9972C);color:#141310;border:0}
button:disabled{opacity:.5;cursor:default}button.ic{width:38px;padding:0;display:inline-flex;align-items:center;justify-content:center}
button.stop{border-color:#6b2c24;color:var(--bad)}button.stop:hover{border-color:var(--bad)}
.menu{display:flex;flex-direction:column;gap:8px}.menu button{width:100%;height:42px}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.big{font-size:34px;font-weight:800;line-height:1;color:#F3E9D2;font-variant-numeric:tabular-nums}
.lbl{font-size:13px;color:var(--mut);margin-top:6px}.gold{color:var(--gold)}.okc{color:var(--ok)}.badc{color:var(--bad)}
.beat{display:flex;gap:3px}.beat i{flex:1;height:24px;border-radius:3px;background:#3FB874}.beat i.d{background:#D9604F}.beat i.n{background:#2c2a25}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.regs{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px}.reg{display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border-radius:999px;background:#0f0e0c;border:1px solid #2c2820;font-weight:700;font-size:13.5px}
.led{width:11px;height:11px;border-radius:50%;background:#D9604F;box-shadow:0 0 0 2px rgba(217,96,79,.18),0 0 8px rgba(217,96,79,.75);flex:none}
.led.on{background:#3FB874;box-shadow:0 0 0 2px rgba(63,184,116,.18),0 0 10px rgba(63,184,116,.85);animation:led 2s infinite}@keyframes led{50%{box-shadow:0 0 0 2px rgba(63,184,116,.1),0 0 4px rgba(63,184,116,.5)}}
.log{flex:1;overflow:auto;min-height:0}.log div{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #1f1d18;font-size:13.5px}.log div:last-child{border:0}
.log .t{color:var(--mut);width:42px;flex:none;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:800;min-width:26px;height:20px;padding:0 7px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.k-ok{background:#17301f;color:var(--ok)}.k-err{background:#341a16;color:var(--bad)}.k-bot{background:#2a251b;color:var(--gold)}.k-re{background:#2a251b;color:var(--gold)}
.log .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full{grid-column:1/-1;display:flex;align-items:center;justify-content:center}
.center{max-width:380px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.qr{width:220px;height:220px;background:#fff;border-radius:16px;padding:10px;display:flex;align-items:center;justify-content:center}
.qr svg{width:100%;height:100%}.code{font-size:30px;font-weight:800;letter-spacing:.18em;color:var(--gold)}
input{width:100%;height:42px;border-radius:12px;border:1px solid #3a3326;background:#0f0e0c;color:var(--txt);padding:0 14px;font:inherit}
label{display:block;text-align:left;font-size:12px;color:var(--mut);margin:0 0 6px 4px}
.form{width:100%;display:flex;flex-direction:column;gap:10px}.err{color:var(--bad);font-size:13px;min-height:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}.modal.on{display:flex}
.modal .card{max-width:340px;text-align:center;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.3s;background:#1d1b17;border:1px solid #3a3326;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:480px){.app{grid-template-columns:1fr;height:auto}.stats{gap:10px}.big{font-size:28px}}
</style></head>
<body>
<div class="app" id="app"></div>
<div class="modal" id="modal"><div class="card" id="mBox"></div></div>
<div class="toast" id="toast"></div>
<script>
var S = null, mode = '';
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function ago(t){ if(!t) return '-'; var s = Math.max(0, Math.round((S.now - t)/1000)); return s < 60 ? s + ' dtk lalu' : s < 3600 ? Math.round(s/60) + ' mnt lalu' : Math.round(s/3600) + ' jam lalu'; }
function hm(t){ var d = new Date(t); return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); }
function toast(t){ var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ e.classList.remove('on'); }, 2600); }
function closeM(){ $('modal').classList.remove('on'); }
function openM(html){ $('mBox').innerHTML = html; $('modal').classList.add('on'); }
// konfirmasi: judul, keterangan, label tombol, aksi
function ask(t, d, ok, fn, danger){
  openM('<b style="font-size:17px">' + t + '</b><div class="mut small">' + d + '</div><div class="btns"><button onclick="closeM()">Batal</button><button class="' + (danger ? 'stop' : 'pri') + '" id="mOk">' + ok + '</button></div>');
  $('mOk').onclick = function(){ closeM(); fn(); };
}
function menu(){
  var p = S && S.paused;
  openM('<b style="font-size:17px">Menu</b><div class="menu">' +
    '<button id="mRelink"' + (p ? ' disabled' : '') + '>Tautkan ulang WhatsApp</button><button id="mPass">Ganti kata sandi</button>' +
    '<button class="pri" id="mRestart">Restart gateway</button><button id="mOut">Keluar dari panel</button><button class="stop" id="mQuit">Tutup program</button><button onclick="closeM()">Batal</button></div>');
  $('mRelink').onclick = function(){ ask('Tautkan ulang?', 'Tautan WhatsApp sekarang dilepas, lalu QR baru muncul untuk di-scan.', 'Tautkan ulang', function(){ act('relink').catch(function(e){ toast(e.message); }); }); };
  $('mRestart').onclick = restart;
  $('mPass').onclick = gantiSandi;
  $('mOut').onclick = function(){ closeM(); act('keluar').then(function(){ mode = ''; tick.now(); }); };
  $('mQuit').onclick = function(){ ask('Tutup program?', 'Gateway berhenti total. Buka lagi lewat shortcut IRIS Gateway di Desktop (atau otomatis saat laptop dinyalakan ulang).', 'Tutup program', function(){ act('tutup').then(function(){ toast('Program ditutup'); }).catch(function(e){ toast(e.message); }); }, true); };
}
// Restart: program dimuat ulang (kode baru di app\ ikut terbaca) tanpa Tutup program + buka shortcut.
function restart(){
  ask('Restart gateway?', 'Program dimuat ulang (sekitar 15 detik), termasuk file gateway terbaru. Pesan yang belum terkirim tetap menunggu di antrean.', 'Restart', function(){
    act('restart').then(function(){ restart.t = Date.now(); toast('Gateway dimulai ulang...'); }).catch(function(e){ toast(e.message); });
  });
}
function gantiSandi(){
  openM('<b style="font-size:17px">Ganti kata sandi</b><div class="form"><div><label>Kata sandi lama</label><input id="gL" type="password"></div>' +
    '<div><label>Kata sandi baru (min. 8 karakter)</label><input id="gB" type="password"></div><div><label>Ulangi kata sandi baru</label><input id="gU" type="password"></div>' +
    '<div class="err" id="gE"></div><div class="btns"><button onclick="closeM()">Batal</button><button class="pri" id="gOk">Simpan</button></div></div>');
  $('gOk').onclick = function(){
    if ($('gB').value !== $('gU').value) { $('gE').textContent = 'Kata sandi baru tidak sama.'; return; }
    act('ganti-sandi', { lama:$('gL').value, baru:$('gB').value }).then(function(){ closeM(); toast('Kata sandi diganti'); }).catch(function(e){ $('gE').textContent = e.message; });
  };
}
function viewLogin(first){
  return '<div class="full"><div class="center"><div class="emb warn" style="width:92px;height:92px"><img src="/emblem.png" alt=""></div>' +
    '<b style="font-size:20px">' + (first ? 'Buat kata sandi admin' : 'IRIS Gateway') + '</b>' +
    (first ? '<div class="mut small">Kata sandi ini dipakai setiap membuka panel.</div>' : '') +
    '<div class="form"><div><label>Kata sandi' + (first ? ' (min. 8 karakter)' : '') + '</label><input id="lP" type="password" autofocus></div>' +
    (first ? '<div><label>Ulangi kata sandi</label><input id="lU" type="password"></div>' : '') +
    '<div class="err" id="lE"></div><button class="pri" id="lOk">' + (first ? 'Simpan' : 'Masuk') + '</button></div></div></div>';
}
function bindLogin(first){
  var go = function(){
    $('lE').textContent = '';
    if (first && $('lP').value !== $('lU').value) { $('lE').textContent = 'Kata sandi tidak sama.'; return; }
    act(first ? 'sandi-baru' : 'masuk', { password:$('lP').value }).then(function(){ mode = ''; tick.now(); }).catch(function(e){ $('lE').textContent = e.message; });
  };
  $('lOk').onclick = go;
  ['lP','lU'].forEach(function(id){ var e = $(id); if (e) e.onkeydown = function(ev){ if (ev.key === 'Enter') go(); }; });
  setTimeout(function(){ $('lP').focus(); }, 50);
}
function act(a, body){
  return fetch('/api/' + a, { method:'POST', headers:{'X-IRIS':'1','Content-Type':'application/json'}, body: JSON.stringify(body || {}) })
    .then(function(r){ return r.json(); }).then(function(j){ if(!j.ok) throw new Error(j.error || 'Gagal'); return j; });
}
function btn(id, a, okMsg){ var b = $(id); if(!b) return; b.onclick = function(){ b.disabled = true; act(a).then(function(){ toast(okMsg); }).catch(function(e){ toast(e.message); }).then(function(){ setTimeout(function(){ b.disabled = false; }, 1500); }); }; }
var TAG = { ok:'✓', err:'✕', bot:'Bot', re:'↻' };
function viewMain(){
  return '<div class="card side"><div class="emb" id="emb"><img src="/emblem.png" alt="IRIS"></div><span id="pill"></span>' +
    '<div class="mut small" id="poll"></div>' +
    '<div class="btns" id="bRun"><button class="pri" id="bTest">Tes</button><button id="bRe">Sambung ulang</button><button class="ic" id="bRestart" title="Restart gateway (muat ulang program)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button><button class="stop ic" id="bStop" title="Stop gateway"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg></button></div>' +
    '<div class="btns" id="bIdle" style="display:none"><button class="pri" id="bStart">Jalankan</button></div><button class="more" id="bMore" title="Menu">⋯</button></div>' +
    '<div class="main"><div class="stats">' +
    '<div class="card"><div class="big" id="vPend">0</div><div class="lbl">Menunggu</div></div>' +
    '<div class="card"><div class="big gold" id="vSent">0</div><div class="lbl">Terkirim hari ini</div></div>' +
    '<div class="card"><div class="big" id="vFail">0</div><div class="lbl">Gagal</div></div></div>' +
    '<div class="card regs" id="regs"></div>' +
    '<div class="card"><div class="row"><span class="lbl" style="margin:0">24 jam</span><b class="gold" id="vUp"></b></div><div class="beat" id="beat"></div></div>' +
    '<div class="card log" id="log"></div></div>';
}
function viewQr(){
  return '<div class="full"><div class="center"><span class="pill p-warn"><i></i>Menunggu scan</span>' +
    '<div class="qr" id="qr"></div><div class="code" id="code"></div>' +
    '<div class="mut">WhatsApp → <b style="color:#E9E1CF">Perangkat tertaut</b> → Scan</div></div></div>';
}
function viewSetup(){
  var c = S.config || {};
  return '<div class="full"><div class="center"><div class="emb warn" style="width:80px;height:80px"><img src="/emblem.png" alt=""></div>' +
    '<b style="font-size:20px">Atur IRIS Gateway</b><div class="form">' +
    '<div><label>URL Apps Script Waspang</label><input id="fUrl" value="' + esc(c.url) + '" placeholder="https://script.google.com/macros/s/.../exec"></div>' +
    '<div><label>Kata sandi (sama dengan WA_PC_SECRET)</label><input id="fSec" type="password" placeholder="' + (c.hasSecret ? 'tetap seperti sekarang' : 'min. 16 karakter') + '"></div>' +
    '<div><label>Nama grup WhatsApp</label><input id="fGrp" value="' + esc(c.group || 'REPORT BMI') + '"></div>' +
    '<div class="err" id="fErr"></div><button class="pri" id="bSave">Simpan</button></div></div></div>';
}
function render(){
  var m = !S.configured ? 'setup' : S.wa === 'qr' ? 'qr' : 'main';
  if (m !== mode) {
    mode = m; $('app').innerHTML = m === 'setup' ? viewSetup() : m === 'qr' ? viewQr() : viewMain();
    if (m === 'main') {
      btn('bTest','test','Pesan tes terkirim ke grup'); btn('bRe','reconnect','Menyambung ulang...'); btn('bStart','start','Gateway dijalankan');
      $('bMore').onclick = menu; $('bRestart').onclick = restart;
      $('bStop').onclick = function(){ ask('Stop gateway?', 'WhatsApp diputus dan laporan menunggu di portal sampai gateway dijalankan lagi. Tetap Stop walau laptop dinyalakan ulang.', 'Stop', function(){ act('stop').then(function(){ toast('Gateway dihentikan'); }).catch(function(e){ toast(e.message); }); }, true); };
    }
    if (m === 'setup') $('bSave').onclick = function(){
      $('fErr').textContent = ''; act('setup', { url:$('fUrl').value, secret:$('fSec').value, group:$('fGrp').value })
        .then(function(){ toast('Tersimpan, gateway dimulai ulang...'); }).catch(function(e){ $('fErr').textContent = e.message; });
    };
  }
  if (m === 'qr') { $('qr').innerHTML = S.qrSvg || '<span class="mut small">Menyiapkan QR...</span>'; $('code').textContent = S.pairCode || ''; $('qr').style.display = S.pairCode ? 'none' : ''; return; }
  if (m !== 'main') return;
  var on = S.wa === 'open', conn = S.wa === 'connecting', idle = S.paused;
  $('emb').className = 'emb ' + (idle ? 'idle' : on ? 'on' : conn ? 'warn' : 'off');
  $('pill').innerHTML = idle ? '<span class="pill p-idle"><i></i>Berhenti</span>' : on ? '<span class="pill p-ok"><i></i>Tersambung</span>' : conn ? '<span class="pill p-warn"><i></i>Menyambung...</span>' : '<span class="pill p-bad"><i></i>Terputus</span>';
  $('poll').innerHTML = idle ? 'Laporan menunggu di portal' : S.lastPollErr && S.lastPoll > S.lastPollOk ? '<span class="badc">Antrean gagal diambil</span>' : 'Antrean dicek ' + ago(S.lastPollOk);
  $('bRun').style.display = idle ? 'none' : ''; $('bIdle').style.display = idle ? '' : 'none';
  $('bTest').disabled = !on;
  $('vPend').textContent = S.pending; $('vSent').textContent = S.sent;
  $('vFail').textContent = S.fail; $('vFail').className = 'big ' + (S.fail ? 'badc' : 'okc');
  $('vUp').textContent = S.uptime == null ? '' : String(S.uptime).replace('.', ',') + '%';
  // Grup per region: LED hijau = WhatsApp tersambung dan grup ditemukan; merah = terputus / grup tidak ditemukan.
  $('regs').innerHTML = (S.groups && S.groups.length ? S.groups : [{ name: 'Utama', grup: '', ok: on }]).map(function(g){
    return '<span class="reg" title="' + esc(g.grup || '') + '"><i class="led' + (g.ok && !idle ? ' on' : '') + '"></i>' + esc(g.name) + '</span>';
  }).join('');
  $('beat').innerHTML = S.bars.map(function(b){ return '<i class="' + (b === 0 ? 'd' : b < 0 ? 'n' : '') + '"></i>'; }).join('');
  $('log').innerHTML = S.events.length ? S.events.slice(0, 4).map(function(e){
    return '<div><span class="t">' + hm(e.t) + '</span><span class="tag k-' + e.k + '">' + TAG[e.k] + '</span><span class="x">' + esc(e.x) + '</span></div>';
  }).join('') : '<div class="mut">Belum ada aktivitas</div>';
}
function showLogin(){
  return fetch('/api/auth', { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(a){
    var m = a.hasPass ? 'login' : 'first';
    if (m !== mode) { mode = m; closeM(); $('app').innerHTML = viewLogin(m === 'first'); bindLogin(m === 'first'); }
  });
}
function tick(){
  clearTimeout(tick.t);
  fetch('/api/status', { cache:'no-store' }).then(function(r){
      if (r.status === 401) return showLogin();
      return r.json().then(function(j){ if (restart.t && j.startedAt > restart.t) { restart.t = 0; toast('Gateway sudah dimulai ulang'); } S = j; render(); });
    })
    .catch(function(){
      if (restart.t && Date.now() - restart.t < 90000) { if (mode !== 'restart') { mode = 'restart'; closeM(); $('app').innerHTML = '<div class="full"><div class="center"><span class="pill p-warn"><i></i>Memulai ulang...</span><div class="mut small">Gateway dimuat ulang, panel kembali sendiri dalam beberapa detik.</div></div></div>'; } return; }
      if (mode !== 'down') { mode = 'down'; closeM(); $('app').innerHTML = '<div class="full"><div class="center"><span class="pill p-bad"><i></i>Gateway tidak berjalan</span><div class="mut small">Buka lagi lewat shortcut IRIS Gateway di Desktop.</div></div></div>'; } })
    .then(function(){ tick.t = setTimeout(tick, 2000); });
}
tick.now = function(){ tick(); };
// Jendela kecil: tampilan sama dengan desain A (dirancang 1000x430), diperkecil supaya muat.
function fit(){
  var w = innerWidth, h = innerHeight, z = w <= 480 ? 1 : Math.min(1, w / 1000, h / 430);
  document.body.style.zoom = z;
  $('app').style.height = w <= 480 ? 'auto' : (h / z) + 'px';
}
addEventListener('resize', fit); fit();
tick();
</script>
</body></html>
